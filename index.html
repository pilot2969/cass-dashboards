<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CASS Intelligence Board</title><script src="https://cdn.tailwindcss.com"></script><style>body{background-color:#0f172a;color:#f8fafc;font-family:ui-sans-serif,system-ui,sans-serif;}.card{background-color:#1e293b;border:1px solid #334155;}</style></head><body><div class="max-w-4xl mx-auto p-6 md:p-12">
<div id="app"><p class="text-slate-400">Loading model state…</p></div>
<footer class="text-center text-slate-500 text-xs mt-10">CASS Intelligence Board · Data-driven build v2.0 · <span id="gen"></span></footer>
</div><script>
fetch('data.json').then(r=>r.json()).then(D=>{
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const badge=c=>c>=0.9?'bg-red-600':c>=0.7?'bg-amber-600':'bg-slate-600';
document.getElementById('gen').textContent=D.meta.generated;
let h=`<div class="card p-6 rounded-xl mb-8 border-l-4 border-red-500">
<div class="px-3 py-1 bg-red-600 text-white text-xs font-bold uppercase tracking-wider rounded inline-block mb-2">Macro Forecast · Active</div>
<h2 class="text-2xl font-bold mb-2">${esc(D.macro_forecast.title)}</h2>
<p class="text-3xl font-extrabold text-red-400 mb-2">CASS Confidence: ${Math.round(D.macro_forecast.confidence*100)}% <span class="text-amber-400 text-lg">(raised from ${Math.round(D.macro_forecast.previous_confidence*100)}% on ${esc(D.macro_forecast.raised_date)})</span></p>
<p class="text-slate-300 text-sm">Status: ${esc(D.macro_forecast.status)} · Falsifiers armed and posted. If any trigger, this forecast is retired publicly.</p></div>`;
h+=`<h3 class="text-lg font-bold text-emerald-400 mb-3 mt-8">Prediction Register (${D.predictions.length})</h3>`;
const byStatus={};D.predictions.forEach(p=>{(byStatus[p.status]??=[]).push(p)});
['confirmed','emergent','pending','failed'].forEach(st=>{
if(!byStatus[st])return;
h+=`<p class="text-sm font-bold text-slate-300 uppercase tracking-wide mt-4 mb-2">${st} (${byStatus[st].length})</p>`;
byStatus[st].sort((a,b)=>b.confidence-a.confidence).forEach(p=>{
h+=`<div class="card p-6 rounded-xl mb-4 border-l-4 ${p.confidence>=0.9?'border-red-500':p.confidence>=0.7?'border-amber-500':'border-slate-600'}">
<div class="flex flex-wrap items-center gap-2 mb-2"><span class="px-3 py-1 ${badge(p.confidence)} text-white text-xs font-bold rounded">${Math.round(p.confidence*100)}%</span><span class="px-3 py-1 bg-slate-800 text-amber-400 border border-amber-500/30 text-xs font-semibold rounded">${esc(p.status)}</span><span class="text-slate-400 text-xs">${esc(p.date_made)}</span></div>
<p class="text-lg font-bold text-amber-400 mb-2">${esc(p.title)}</p>
<p class="text-slate-300 text-sm">${esc(p.statement)}</p>
${p.falsifier?`<p class="text-slate-400 text-xs mt-3"><strong class="text-red-400">Falsifier:</strong> ${esc(p.falsifier)}</p>`:''}
${p.forward_watchlist&&p.forward_watchlist.length?`<p class="text-slate-400 text-xs mt-2"><strong class="text-amber-400">Watch:</strong> ${esc(p.forward_watchlist.join(' · '))}</p>`:''}
</div>`;});});
h+=`<h3 class="text-lg font-bold text-emerald-400 mb-3 mt-8">MGET Ledger (recent)</h3>`;
D.mget_ledger.slice(-10).reverse().forEach(l=>{
h+=`<div class="card p-4 rounded-xl mb-3 border-l-4 border-slate-600"><p class="text-sm font-bold text-amber-400">${esc(l.date)} · ${esc(l.track||'')} · <span class="text-emerald-400">${esc(l.verdict)}</span></p><p class="text-slate-300 text-xs mt-1">${esc(l.reasoning)}</p>${l.forward_signal?`<p class="text-slate-400 text-xs mt-2"><strong>Signal:</strong> ${esc(l.forward_signal)}</p>`:''}</div>`;});
document.getElementById('app').innerHTML=h;
}).catch(e=>{document.getElementById('app').innerHTML='<p class="text-red-400">Failed to load data.json: '+e+'</p>';});
</script></body></html>
